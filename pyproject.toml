[project]
name = "dit-amp"
version = "0.1.0"
description = "DiT-AMP: discrete diffusion transformer for antimicrobial peptide design (AMP Challenge 2027)"
readme = "README.md"
authors = [
    { name = "Alireza Noroozi", email = "noroozi.alirezaa@gmail.com" }
]
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = [
    "levenshtein>=0.27.3",
    "numpy>=2.2.6",
    "onnxruntime>=1.20",
    "pyyaml>=6.0",
    "torch==2.11.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[project.scripts]
generate = "dit_amp.generate:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dit_amp"
module-root = "src"
